<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena WebSocket Fixes Verification</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .test-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        .test-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .success {
            color: #4CAF50;
            font-weight: bold;
        }

        .error {
            color: #f44336;
            font-weight: bold;
        }

        .warning {
            color: #ff9800;
            font-weight: bold;
        }

        .info {
            color: #2196F3;
            font-weight: bold;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: #4CAF50;
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Arena WebSocket Fixes Verification</h1>

        <div class="test-section">
            <div class="test-title">📋 Test Configuration</div>
            <div class="input-group">
                <label for="testToken">User Token (for testing):</label>
                <input type="text" id="testToken" placeholder="Enter your user token here" value="test_token_12345">
            </div>
            <div class="input-group">
                <label for="testSessionId">Session ID (for testing):</label>
                <input type="text" id="testSessionId" placeholder="Enter session ID" value="TEST123">
            </div>
            <button onclick="runAllTests()">🧪 Run All Tests</button>
            <button onclick="testUrlCleaning()">🔗 Test URL Cleaning</button>
            <button onclick="testConnection()">🔌 Test WebSocket Connection</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>

        <div class="test-section">
            <div class="test-title">📊 Test Progress</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <div id="progressText">Ready to run tests...</div>
        </div>

        <div class="test-section">
            <div class="test-title">📝 Test Results</div>
            <div id="testResults">
                <div class="info">Click "Run All Tests" to start verification...</div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">📋 Console Logs</div>
            <div class="log-container" id="logContainer">
                <div>Logs will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket Utilities (simplified version for testing)
        function cleanWebSocketUrl(url) {
            if (!url) {
                log('❌ Empty URL provided', 'error');
                return url;
            }

            try {
                const urlObj = new URL(url);
                const cleanUrl = `${urlObj.protocol}//${urlObj.host}`;

                log(`✅ URL cleaned: ${url} → ${cleanUrl}`, 'success');
                return cleanUrl;
            } catch (e) {
                log(`⚠️ URL parse failed, using fallback: ${e.message}`, 'warning');
                let clean = url
                    .split('/ws/')[0]
                    .split('/game/')[0]
                    .split('?')[0]
                    .split('#')[0];

                log(`✅ URL cleaned via fallback: ${url} → ${clean}`, 'success');
                return clean;
            }
        }

        function extractSessionId(url) {
            if (!url) return null;

            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/');
                const wsIndex = pathParts.indexOf('ws');

                if (wsIndex !== -1 && pathParts[wsIndex + 1]) {
                    const sessionId = pathParts[wsIndex + 1];
                    log(`✅ Session ID extracted from pathname: ${sessionId}`, 'success');
                    return sessionId;
                }

                const sessionParam = urlObj.searchParams.get('sessionId') || urlObj.searchParams.get('session');
                if (sessionParam) {
                    log(`✅ Session ID extracted from query: ${sessionParam}`, 'success');
                    return sessionParam;
                }

                log('⚠️ No session ID found in URL', 'warning');
                return null;
            } catch (e) {
                log(`❌ Failed to extract session ID: ${e.message}`, 'error');
                return null;
            }
        }

        function validateWebSocketConfig(url, token, appId) {
            const errors = [];
            const warnings = [];

            if (!url) errors.push('WebSocket URL is required');
            if (!token) errors.push('User token is required');
            if (!appId) errors.push('Vorld App ID is required');

            if (url && (url.includes('/ws/') || url.includes('/game/'))) {
                errors.push('URL should not contain session paths (/ws/ or /game/). Use cleanWebSocketUrl() first.');
            }

            if (url && !url.startsWith('wss://') && !url.startsWith('ws://')) {
                warnings.push('URL should use WebSocket protocol (wss:// or ws://)');
            }

            return {
                valid: errors.length === 0,
                errors: errors,
                warnings: warnings
            };
        }

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span style="color: #888">[${timestamp}]</span> ${message}`;
            logEntry.className = type;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;

            console.log(`[${timestamp}] ${message}`);
        }

        function updateProgress(current, total, message) {
            const percentage = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${message} (${current}/${total})`;
        }

        function addTestResult(testName, status, details = '') {
            const resultsContainer = document.getElementById('testResults');
            const testItem = document.createElement('div');
            testItem.className = 'test-item';

            const statusIcon = status === 'success' ? '✅' : status === 'error' ? '❌' : '⚠️';
            const statusClass = status;

            testItem.innerHTML = `
                <span class="${statusClass}">${statusIcon} ${testName}</span>
                ${details ? `<br><small>${details}</small>` : ''}
            `;

            resultsContainer.appendChild(testItem);
        }

        function testUrlCleaning() {
            log('🔗 Testing URL Cleaning...', 'info');
            updateProgress(1, 5, 'Testing URL Cleaning');

            const testUrls = [
                {
                    input: 'wss://airdrop-arcade.onrender.com/ws/PJ3Q7Z',
                    expected: 'wss://airdrop-arcade.onrender.com',
                    description: 'Standard Arena URL'
                },
                {
                    input: 'wss://airdrop-arcade.onrender.com/game/ABC123',
                    expected: 'wss://airdrop-arcade.onrender.com',
                    description: 'Game path URL'
                },
                {
                    input: 'wss://airdrop-arcade.onrender.com',
                    expected: 'wss://airdrop-arcade.onrender.com',
                    description: 'Clean URL'
                },
                {
                    input: 'https://server.com/ws/XYZ?token=abc',
                    expected: 'https://server.com',
                    description: 'HTTPS with query'
                },
                {
                    input: 'ws://localhost:3000/ws/session123',
                    expected: 'ws://localhost:3000',
                    description: 'Local development'
                }
            ];

            let passed = 0;
            let total = testUrls.length;

            testUrls.forEach((test, index) => {
                const result = cleanWebSocketUrl(test.input);
                const success = result === test.expected;

                if (success) {
                    passed++;
                    addTestResult(`URL Cleaning ${index + 1}`, 'success', `${test.description}: ${test.input} → ${result}`);
                } else {
                    addTestResult(`URL Cleaning ${index + 1}`, 'error', `${test.description}: Expected ${test.expected}, got ${result}`);
                }
            });

            updateProgress(2, 5, 'URL Cleaning Complete');
            log(`📊 URL Cleaning Results: ${passed}/${total} tests passed`, passed === total ? 'success' : 'warning');

            return { passed, total };
        }

        function testSessionIdExtraction() {
            log('🆔 Testing Session ID Extraction...', 'info');
            updateProgress(2, 5, 'Testing Session ID Extraction');

            const testUrls = [
                {
                    input: 'wss://airdrop-arcade.onrender.com/ws/PJ3Q7Z',
                    expected: 'PJ3Q7Z',
                    description: 'Standard session'
                },
                {
                    input: 'wss://server.com/ws/ABC123?param=value',
                    expected: 'ABC123',
                    description: 'Session with query'
                },
                {
                    input: 'wss://server.com/api?sessionId=XYZ789',
                    expected: 'XYZ789',
                    description: 'Session from query param'
                },
                {
                    input: 'wss://airdrop-arcade.onrender.com',
                    expected: null,
                    description: 'No session present'
                }
            ];

            let passed = 0;
            let total = testUrls.length;

            testUrls.forEach((test, index) => {
                const result = extractSessionId(test.input);
                const success = result === test.expected;

                if (success) {
                    passed++;
                    addTestResult(`Session Extraction ${index + 1}`, 'success', `${test.description}: ${result || 'null'}`);
                } else {
                    addTestResult(`Session Extraction ${index + 1}`, 'error', `${test.description}: Expected ${test.expected}, got ${result}`);
                }
            });

            updateProgress(3, 5, 'Session ID Extraction Complete');
            log(`📊 Session ID Extraction Results: ${passed}/${total} tests passed`, passed === total ? 'success' : 'warning');

            return { passed, total };
        }

        function testConfigurationValidation() {
            log('⚙️ Testing Configuration Validation...', 'info');
            updateProgress(3, 5, 'Testing Configuration Validation');

            const testConfigs = [
                {
                    config: {
                        url: 'wss://airdrop-arcade.onrender.com',
                        token: 'valid_token_12345',
                        appId: 'app_mh96pk5z_ca7db3dd'
                    },
                    expected: true,
                    description: 'Valid complete configuration'
                },
                {
                    config: {
                        url: 'wss://airdrop-arcade.onrender.com/ws/ABC123',
                        token: 'valid_token_12345',
                        appId: 'app_mh96pk5z_ca7db3dd'
                    },
                    expected: false,
                    description: 'URL contains session path'
                },
                {
                    config: {
                        url: null,
                        token: 'valid_token_12345',
                        appId: 'app_mh96pk5z_ca7db3dd'
                    },
                    expected: false,
                    description: 'Missing URL'
                }
            ];

            let passed = 0;
            let total = testConfigs.length;

            testConfigs.forEach((test, index) => {
                const result = validateWebSocketConfig(
                    test.config.url,
                    test.config.token,
                    test.config.appId
                );
                const success = result.valid === test.expected;

                if (success) {
                    passed++;
                    addTestResult(`Config Validation ${index + 1}`, 'success', `${test.description}: ${result.valid ? 'Valid' : 'Invalid'}`);
                } else {
                    const errors = result.errors.join(', ');
                    addTestResult(`Config Validation ${index + 1}`, 'error', `${test.description}: Errors - ${errors}`);
                }
            });

            updateProgress(4, 5, 'Configuration Validation Complete');
            log(`📊 Configuration Validation Results: ${passed}/${total} tests passed`, passed === total ? 'success' : 'warning');

            return { passed, total };
        }

        async function testConnection() {
            log('🔌 Testing WebSocket Connection...', 'info');
            updateProgress(4, 5, 'Testing WebSocket Connection');

            const token = document.getElementById('testToken').value;
            const sessionId = document.getElementById('testSessionId').value;

            if (!token || !sessionId) {
                addTestResult('WebSocket Connection', 'error', 'Missing token or session ID');
                log('❌ Please provide both token and session ID for connection test', 'error');
                return { passed: 0, total: 1 };
            }

            const originalUrl = 'wss://airdrop-arcade.onrender.com/ws/' + sessionId;
            const cleanedUrl = cleanWebSocketUrl(originalUrl);

            log(`🔗 Original URL: ${originalUrl}`, 'info');
            log(`✨ Cleaned URL: ${cleanedUrl}`, 'info');

            try {
                const socket = io(cleanedUrl, {
                    transports: ['websocket'],
                    auth: {
                        token: token,
                        appId: 'app_mh96pk5z_ca7db3dd'
                    },
                    query: { sessionId: sessionId },
                    timeout: 10000
                });

                return new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        addTestResult('WebSocket Connection', 'error', 'Connection timeout after 10 seconds');
                        log('❌ Connection timeout', 'error');
                        socket.disconnect();
                        resolve({ passed: 0, total: 1 });
                    }, 10000);

                    socket.on('connect', () => {
                        clearTimeout(timeout);
                        addTestResult('WebSocket Connection', 'success', `Connected successfully with socket ID: ${socket.id}`);
                        log(`✅ WebSocket connected successfully! Socket ID: ${socket.id}`, 'success');
                        socket.disconnect();
                        resolve({ passed: 1, total: 1 });
                    });

                    socket.on('connect_error', (error) => {
                        clearTimeout(timeout);
                        addTestResult('WebSocket Connection', 'error', `Connection failed: ${error.message}`);
                        log(`❌ WebSocket connection failed: ${error.message}`, 'error');
                        socket.disconnect();
                        resolve({ passed: 0, total: 1 });
                    });
                });
            } catch (error) {
                addTestResult('WebSocket Connection', 'error', `Exception: ${error.message}`);
                log(`❌ Exception during connection: ${error.message}`, 'error');
                return { passed: 0, total: 1 };
            }
        }

        async function runAllTests() {
            log('🧪 Starting Comprehensive Test Suite...', 'info');
            updateProgress(0, 5, 'Initializing tests');

            // Clear previous results
            document.getElementById('testResults').innerHTML = '';

            const startTime = Date.now();
            const results = {};

            // Run all tests
            results.urlCleaning = testUrlCleaning();
            await new Promise(resolve => setTimeout(resolve, 500));

            results.sessionExtraction = testSessionIdExtraction();
            await new Promise(resolve => setTimeout(resolve, 500));

            results.configValidation = testConfigurationValidation();
            await new Promise(resolve => setTimeout(resolve, 500));

            results.connection = await testConnection();

            const endTime = Date.now();
            const duration = endTime - startTime;

            // Calculate overall results
            const totalTests = Object.values(results).reduce((sum, result) => sum + result.total, 0);
            const totalPassed = Object.values(results).reduce((sum, result) => sum + result.passed, 0);
            const successRate = Math.round((totalPassed / totalTests) * 100);

            updateProgress(5, 5, 'All tests complete');

            // Show summary
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary';
            summaryDiv.innerHTML = `
                <h2>📊 Test Suite Summary</h2>
                <p><strong>Total Tests:</strong> ${totalTests}</p>
                <p><strong>Passed:</strong> <span class="success">${totalPassed}</span></p>
                <p><strong>Failed:</strong> <span class="error">${totalTests - totalPassed}</span></p>
                <p><strong>Success Rate:</strong> ${successRate}%</p>
                <p><strong>Duration:</strong> ${duration}ms</p>
                <h3>Status: ${successRate === 100 ? '✅ ALL TESTS PASSED' : successRate >= 80 ? '⚠️ MOSTLY SUCCESSFUL' : '❌ SIGNIFICANT ISSUES'}</h3>
            `;

            document.getElementById('testResults').appendChild(summaryDiv);

            log(`🎯 Test Suite Complete: ${totalPassed}/${totalTests} tests passed (${successRate}%) in ${duration}ms`,
                successRate === 100 ? 'success' : successRate >= 80 ? 'warning' : 'error');

            if (successRate === 100) {
                log('🚀 All fixes are working correctly! Ready for production deployment.', 'success');
            } else if (successRate >= 80) {
                log('⚠️ Mostly successful. Review failed tests before deployment.', 'warning');
            } else {
                log('❌ Significant issues found. Please review and fix before deployment.', 'error');
            }
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '<div>Logs cleared...</div>';
            document.getElementById('testResults').innerHTML = '<div class="info">Click "Run All Tests" to start verification...</div>';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = 'Ready to run tests...';
        }

        // Auto-run a quick validation when page loads
        window.addEventListener('load', () => {
            log('🔧 Arena WebSocket Fixes Verification Tool loaded', 'info');
            log('💡 This tool tests the fixes for the "Invalid namespace" WebSocket error', 'info');
            log('📝 Enter your token and session ID, then click "Run All Tests"', 'info');

            // Run a quick URL cleaning test
            const testUrl = 'wss://airdrop-arcade.onrender.com/ws/TEST123';
            const cleaned = cleanWebSocketUrl(testUrl);
            log(`🔗 Quick test: ${testUrl} → ${cleaned}`, cleaned === 'wss://airdrop-arcade.onrender.com' ? 'success' : 'error');
        });
    </script>
</body>
</html>
