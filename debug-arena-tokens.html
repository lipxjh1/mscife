<!DOCTYPE html>
<html>
<head>
    <title>Arena 401 Debug - Token Check</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #00ff00; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #333; background: #2a2a2a; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .warning { color: #ffd43b; }
        pre { white-space: pre-wrap; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔍 Arena 401 Error - Token Debug</h1>

    <div class="section">
        <h2>📋 Token Storage Analysis</h2>
        <button onclick="checkAllTokens()">Check All Tokens</button>
        <div id="tokenResults"></div>
    </div>

    <div class="section">
        <h2>🌐 Network Request Test</h2>
        <button onclick="testArenaAPI()">Test Arena API</button>
        <div id="networkResults"></div>
    </div>

    <div class="section">
        <h2>🔑 JWT Token Analysis</h2>
        <button onclick="analyzeJWT()">Analyze JWT Tokens</button>
        <div id="jwtResults"></div>
    </div>

    <script>
        function checkAllTokens() {
            const results = document.getElementById('tokenResults');
            let html = '<h3>Token Storage Results:</h3>';

            // Check sessionStorage
            const sessionToken = sessionStorage.getItem('accessToken');
            html += `<div><strong>sessionStorage.accessToken:</strong> ${sessionToken ? '<span class="success">FOUND</span>' : '<span class="error">NOT FOUND</span>'}</div>`;
            if (sessionToken) {
                html += `<div>Length: ${sessionToken.length} characters</div>`;
                html += `<div>Parts: ${sessionToken.split('.').length} (should be 3 for JWT)</div>`;
            }

            // Check localStorage
            const localToken = localStorage.getItem('accessToken');
            html += `<div><strong>localStorage.accessToken:</strong> ${localToken ? '<span class="success">FOUND</span>' : '<span class="error">NOT FOUND</span>'}</div>`;
            if (localToken) {
                html += `<div>Length: ${localToken.length} characters</div>`;
                html += `<div>Parts: ${localToken.split('.').length} (should be 3 for JWT)</div>`;
            }

            // Check Vorld tokens
            const vorldToken = localStorage.getItem('vorldAccessToken');
            html += `<div><strong>localStorage.vorldAccessToken:</strong> ${vorldToken ? '<span class="success">FOUND</span>' : '<span class="error">NOT FOUND</span>'}</div>`;
            if (vorldToken) {
                html += `<div>Length: ${vorldToken.length} characters</div>`;
                html += `<div>Parts: ${vorldToken.split('.').length} (should be 3 for JWT)</div>`;
            }

            const vorldRefreshToken = localStorage.getItem('vorldRefreshToken');
            html += `<div><strong>localStorage.vorldRefreshToken:</strong> ${vorldRefreshToken ? '<span class="success">FOUND</span>' : '<span class="error">NOT FOUND</span>'}</div>`;

            // Active token determination
            const activeToken = sessionToken || localToken;
            html += `<div><strong>Active Token Source:</strong> ${sessionToken ? 'sessionStorage' : (localToken ? 'localStorage' : '<span class="error">NONE</span>')}</div>`;

            results.innerHTML = html;
        }

        function analyzeJWT() {
            const results = document.getElementById('jwtResults');
            let html = '<h3>JWT Analysis Results:</h3>';

            const token = sessionStorage.getItem('accessToken') || localStorage.getItem('accessToken');

            if (!token) {
                html += '<div class="error">❌ No Backend JWT token found</div>';
                results.innerHTML = html;
                return;
            }

            try {
                const parts = token.split('.');
                if (parts.length !== 3) {
                    html += '<div class="error">❌ Invalid JWT format (should have 3 parts)</div>';
                    results.innerHTML = html;
                    return;
                }

                // Decode payload
                const payload = JSON.parse(atob(parts[1]));
                html += '<div class="success">✅ JWT Format Valid</div>';
                html += `<div><strong>User ID:</strong> ${payload.userId || 'NOT FOUND'}</div>`;
                html += `<div><strong>Issued At:</strong> ${payload.iat ? new Date(payload.iat * 1000).toLocaleString() : 'NOT FOUND'}</div>`;
                html += `<div><strong>Expires At:</strong> ${payload.exp ? new Date(payload.exp * 1000).toLocaleString() : 'NOT FOUND'}</div>`;

                if (payload.exp) {
                    const now = Date.now() / 1000;
                    const timeLeft = payload.exp - now;
                    html += `<div><strong>Time Until Expiry:</strong> ${Math.floor(timeLeft / 60)} minutes</div>`;

                    if (timeLeft <= 0) {
                        html += '<div class="error">❌ TOKEN EXPIRED!</div>';
                    } else if (timeLeft < 300) {
                        html += '<div class="warning">⚠️ Token expires soon (less than 5 minutes)</div>';
                    } else {
                        html += '<div class="success">✅ Token valid</div>';
                    }
                }

                html += `<div><strong>Full Payload:</strong></div><pre>${JSON.stringify(payload, null, 2)}</pre>`;

            } catch (error) {
                html += `<div class="error">❌ Failed to decode JWT: ${error.message}</div>`;
            }

            // Also check Vorld token
            const vorldToken = localStorage.getItem('vorldAccessToken');
            if (vorldToken) {
                html += '<h4>Vorld Token Analysis:</h4>';
                try {
                    const parts = vorldToken.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        html += '<div class="success">✅ Vorld JWT Format Valid</div>';
                        html += `<div><strong>Vorld User ID:</strong> ${payload.sub || payload.id || 'NOT FOUND'}</div>`;
                        html += `<div><strong>Expires:</strong> ${payload.exp ? new Date(payload.exp * 1000).toLocaleString() : 'NOT FOUND'}</div>`;

                        if (payload.exp) {
                            const now = Date.now() / 1000;
                            const timeLeft = payload.exp - now;
                            html += `<div><strong>Vorld Token Time Left:</strong> ${Math.floor(timeLeft / 60)} minutes</div>`;

                            if (timeLeft <= 0) {
                                html += '<div class="error">❌ VORLD TOKEN EXPIRED!</div>';
                            }
                        }
                    } else {
                        html += '<div class="warning">⚠️ Vorld token is not JWT format (may be opaque token)</div>';
                    }
                } catch (error) {
                    html += `<div class="error">❌ Failed to decode Vorld token: ${error.message}</div>`;
                }
            } else {
                html += '<div class="error">❌ No Vorld token found</div>';
            }

            results.innerHTML = html;
        }

        async function testArenaAPI() {
            const results = document.getElementById('networkResults');
            results.innerHTML = '<h3>Testing Arena API...</h3><div>Please wait...</div>';

            const token = sessionStorage.getItem('accessToken') || localStorage.getItem('accessToken');
            const vorldToken = localStorage.getItem('vorldAccessToken');

            let html = '<h3>Arena API Test Results:</h3>';

            if (!token) {
                html += '<div class="error">❌ Cannot test: No Backend token found</div>';
                results.innerHTML = html;
                return;
            }

            try {
                html += '<div>📡 Sending POST /api/arena/games/init request...</div>';

                const response = await fetch('https://pro.m-sci.net/api/arena/games/init', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(vorldToken && { 'X-Vorld-Token': vorldToken })
                    },
                    body: JSON.stringify({
                        streamUrl: 'https://twitch.tv/test'
                    })
                });

                html += `<div><strong>Status:</strong> ${response.status} ${response.statusText}</div>`;

                const responseText = await response.text();
                html += `<div><strong>Response:</strong></div><pre>${responseText}</pre>`;

                if (response.status === 401) {
                    html += '<div class="error">❌ 401 Unauthorized - This is the error we are debugging!</div>';
                } else if (response.status === 200) {
                    html += '<div class="success">✅ Request successful!</div>';
                } else {
                    html += `<div class="warning">⚠️ Unexpected status code: ${response.status}</div>`;
                }

            } catch (error) {
                html += `<div class="error">❌ Network error: ${error.message}</div>`;
            }

            results.innerHTML = html;
        }

        // Auto-run on page load
        window.onload = function() {
            checkAllTokens();
            analyzeJWT();
        };
    </script>
</body>
</html>
